name: Publish to npm

# push a tag that matches package.json, e.g.:
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # npm provenance and trusted publishing
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # npm 11.5+ for trusted publishing
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Who publishes
        run: npm whoami || echo "no NPM_TOKEN accepted, relying on trusted publishing"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # NPM_TOKEN secret if set; without it npm uses trusted publishing (OIDC) configured on npmjs.com
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
